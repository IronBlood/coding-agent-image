name: Manual Docker Build

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-base-and-runtime:
    runs-on: ubuntu-latest

    env:
      USERNAME: claude
      UID: 1000
      GID: 1000
      RUNTIME_IMAGE: coding-agent-image:ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Derive image names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_tag="$(date -u +%Y%m%d%H%M)"
          echo "IMAGE_TAG=${image_tag}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE_LATEST=ghcr.io/${owner}/coding-agent-image-base:latest" >> "$GITHUB_ENV"
          echo "BASE_IMAGE_VERSIONED=ghcr.io/${owner}/coding-agent-image-base:${image_tag}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=base-${image_tag}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared base image
        run: |
          docker build \
            -f Dockerfile.base \
            -t "$BASE_IMAGE_LATEST" \
            -t "$BASE_IMAGE_VERSIONED" \
            .

      - name: Push shared base image
        run: |
          docker push "$BASE_IMAGE_LATEST"
          docker push "$BASE_IMAGE_VERSIONED"

      - name: Check agents in shared base image
        run: |
          docker run --rm "$BASE_IMAGE_VERSIONED" which claude
          docker run --rm "$BASE_IMAGE_VERSIONED" claude --version
          docker run --rm "$BASE_IMAGE_VERSIONED" which pi
          docker run --rm "$BASE_IMAGE_VERSIONED" pi --version
          docker run --rm "$BASE_IMAGE_VERSIONED" which codex
          docker run --rm "$BASE_IMAGE_VERSIONED" codex --version
          docker run --rm "$BASE_IMAGE_VERSIONED" which copilot
          docker run --rm "$BASE_IMAGE_VERSIONED" copilot --version
          docker run --rm "$BASE_IMAGE_VERSIONED" which gemini
          docker run --rm "$BASE_IMAGE_VERSIONED" gemini --version

      - name: Generate release notes
        run: |
          claude_version="$(docker run --rm "$BASE_IMAGE_VERSIONED" claude --version)"
          pi_version="$(docker run --rm "$BASE_IMAGE_VERSIONED" pi --version)"
          codex_version="$(docker run --rm "$BASE_IMAGE_VERSIONED" codex --version)"
          copilot_version="$(docker run --rm "$BASE_IMAGE_VERSIONED" copilot --version)"
          gemini_version="$(docker run --rm "$BASE_IMAGE_VERSIONED" gemini --version)"

          {
            echo "## Coding Agent Base Image"
            echo
            echo "- Versioned image: \`$BASE_IMAGE_VERSIONED\`"
            echo "- Moving latest image: \`$BASE_IMAGE_LATEST\`"
            echo
            echo "## Included Agents"
            echo
            echo "| Agent | Version |"
            echo "| --- | --- |"
            echo "| Claude Code | \`$claude_version\` |"
            echo "| Pi | \`$pi_version\` |"
            echo "| Codex CLI | \`$codex_version\` |"
            echo "| GitHub Copilot CLI | \`$copilot_version\` |"
            echo "| Gemini CLI | \`$gemini_version\` |"
          } > release-notes.md

          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build user-facing image
        run: |
          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE_VERSIONED" \
            --build-arg USERNAME="$USERNAME" \
            --build-arg UID="$UID" \
            --build-arg GID="$GID" \
            -t "$RUNTIME_IMAGE" .

      - name: Check agents as configured non-root user
        run: |
          docker run --rm "$RUNTIME_IMAGE" which claude
          docker run --rm "$RUNTIME_IMAGE" claude --version
          docker run --rm "$RUNTIME_IMAGE" which pi
          docker run --rm "$RUNTIME_IMAGE" pi --version
          docker run --rm "$RUNTIME_IMAGE" which codex
          docker run --rm "$RUNTIME_IMAGE" codex --version
          docker run --rm "$RUNTIME_IMAGE" which copilot
          docker run --rm "$RUNTIME_IMAGE" copilot --version
          docker run --rm "$RUNTIME_IMAGE" which gemini
          docker run --rm "$RUNTIME_IMAGE" gemini --version

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
